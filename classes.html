<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="კომაროვის სკოლის მათემატიკისა და ფიზიკის ქვიზები 7–11 კლასებისთვის. აირჩიეთ კლასი ან შექმენით შემთხვევითი ქვიზი.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="კომაროვის ქვიზები">
    <meta property="og:locale" content="ka_GE">
    <meta property="og:title" content="ქვიზები კლასების მიხედვით · კომაროვის ქვიზები">
    <meta property="og:description" content="კომაროვის სკოლის მათემატიკისა და ფიზიკის ქვიზები 7–11 კლასებისთვის. აირჩიეთ კლასი ან შექმენით შემთხვევითი ქვიზი.">
    <title>მათემატიკის ქვიზები</title>

    <link rel="stylesheet" href="style.css?v=6">
    <link rel="stylesheet" href="classes-style.css?v=5">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="theme.css?v=24">
    <link rel="icon" type="image/png" href="paper.png">
    <script src="darkmode.js?v=7"></script>
    <!-- student accounts (optional login): library, project config, header widget -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js" defer></script>
    <script src="supabase-config.js?v=6" defer></script>
    <script src="auth.js?v=9" defer></script>
    <script src="cloud.js?v=9" defer></script>
    <script src="subjects.js?v=6"></script>
    <script src="feedback.js?v=5" defer></script>
    <script src="notice.js?v=7" defer></script>
</head>
<body>
    <nav class="main-nav">
        <div class="nav-content">
            <a href="index.html" class="logo">
                <i class="fas fa-square-root-variable" id="subject-icon"></i>
                <span id="subject-name">მათემატიკის ქვიზები</span>
            </a>
            <button id="toggle-dark" aria-label="Toggle dark mode">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </nav>

    <div class="classes-container">
        <div class="subject-header">
            <h1 class="text-title">აირჩიეთ <span class="highlight">კლასი</span></h1>
        </div>

        <!-- Grade cards are added from quizzes.json, so only grades with quizzes appear. -->
        <div class="grade-grid" id="gradeGrid"></div>
    </div>

    <footer class="main-footer">
        <p>&copy; 2026 სსიპ ვლადიმირ კომაროვის თბილისის ფიზიკა-მათემატიკის N199 საჯარო სკოლა. ყველა უფლება დაცულია.</p>
        <p>საკონტაქტო ინფორმაცია:
        <a href="mailto:komaroviqvizebi@gmail.com" class="email-link">komaroviqvizebi@gmail.com</a>
        </p>

        <style>
        .email-link {
            color: var(--primary-color);
            text-decoration: none;
            transition: text-decoration 0.2s ease;
        }

    .email-link:hover {
        text-decoration: underline;
    }
    </style>
    </footer>

    <script>
    (function () {
        const { subject, pageUrl, loadQuizIndex, ordinal } = window.QuizSite;
        const heading = `${subject.genitive} ქვიზები`;
        document.title = heading;
        document.getElementById("subject-name").textContent = heading;
        document.getElementById("subject-icon").className = `fas ${subject.icon}`;

        // Math has a tagged problem bank: link to the problem browser under the title.
        if (subject.id === "math") {
            const link = document.createElement("a");
            link.href = "problems.html";
            link.className = "problem-bank-link";
            link.innerHTML = '<i class="fas fa-magnifying-glass" aria-hidden="true"></i> ამოცანების ბაზა — ძიება თემების მიხედვით';
            document.querySelector(".subject-header").appendChild(link);

            // Theory pages: linked once at least one is reviewed (drafts: same rule as TagUI.theoryDrafts).
            let drafts = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
            try { drafts = drafts || localStorage.getItem("theory-drafts") === "1"; } catch (e) {}
            fetch("data/theory.json", { cache: "no-cache" })
                .then(r => (r.ok ? r.json() : []))
                .then(rows => {
                    if (!rows.some(r => r.reviewed || drafts)) return;
                    const t = document.createElement("a");
                    t.href = "theory.html";
                    t.className = "problem-bank-link";
                    t.innerHTML = '<i class="fas fa-book-open" aria-hidden="true"></i> თეორია — განმარტებები და ამოხსნილი მაგალითები';
                    link.after(" ", t);
                })
                .catch(() => {});
        }

        const grid = document.getElementById("gradeGrid");

        function card(href, inner, extraClass) {
            const a = document.createElement("a");
            a.href = href;
            a.className = "grade-card" + (extraClass ? " " + extraClass : "");
            a.innerHTML = `<div class="shine"></div><div class="grade-content">${inner}</div>`;
            return a;
        }

        function render(grades) {
            grades.forEach(g => {
                grid.appendChild(card(
                    pageUrl("class-quizzes.html", { class: g }),
                    `<span class="grade-number">${g}</span><h2>${ordinal(g)} კლასი</h2>`
                ));
            });
            grid.appendChild(card(
                pageUrl("random-quiz-generator.html"),
                `<span class="grade-number">?</span><h2>შემთხვევითი ქვიზის გენერირება</h2>`,
                "special"
            ));
        }

        loadQuizIndex()
            .then(index => render(Object.keys(index).map(Number).sort((a, b) => a - b)))
            .catch(() => render(subject.id === "physics" ? [8, 9, 10, 11] : [7, 8, 9, 10, 11]));
    })();
    </script>

    <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
