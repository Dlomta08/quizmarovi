        <!-- Grade notes are added from quizzes.json, so only grades with quizzes appear;
             under them the problem bank / theory cards and the random quiz link (theme.css). -->

        <div class="grade-extras" id="gradeExtras"></div>
    </div>

        <p>საკონტაქტო ინფორმაცია:
        <a href="mailto:komaroviqvizebi@gmail.com" class="email-link">komaroviqvizebi@gmail.com</a>
        </p>

        <style>
        .email-link {
            color: var(--primary-color);
            text-decoration: none;
            transition: text-decoration 0.2s ease;

    .email-link:hover {

    </style>
    </footer>

    <script>
    (function () {
        const { subject, pageUrl, loadQuizIndex, ordinal } = window.QuizSite;
        const heading = `${subject.genitive} ქვიზები`;
        document.title = heading;
        document.getElementById("subject-name").textContent = heading;
        document.getElementById("subject-icon").className = `fas ${subject.icon}`;

        const grid = document.getElementById("gradeGrid");
        const extras = document.getElementById("gradeExtras");

        /* ---- progress saved by quiz.js in this browser: a quiz counts as done when it was finished
           (best score saved) or marked done; same keys as class-quizzes.html ---- */
        function safeGet(key) {
            try { return localStorage.getItem(key); } catch { return null; }
        }
        function quizDone(g, year, q) {
            const key = `done-${subject.keyPrefix}${g}-${year}-${q}`;
            return safeGet(key) === "true" || !!safeGet(key.replace(/^done-/, "best-"));
        }

        // One sticky note per grade: number, name, how many quizzes over how many years and,
        // once the student has finished any quiz of this subject, how many of this grade's are done.
        function gradeNote(g, years, showProgress) {
            const yearList = Object.keys(years);
            const total = yearList.reduce((n, y) => n + years[y].length, 0);
            const done = yearList.reduce((n, y) => n + years[y].filter(q => quizDone(g, y, q)).length, 0);
            const a = document.createElement("a");
            a.href = pageUrl("class-quizzes.html", { class: g });
            a.className = "grade-card";
            a.innerHTML = `<div class="grade-content"><span class="grade-number"></span><h2></h2>
                <span class="grade-meta"></span></div>`;
            a.querySelector(".grade-number").textContent = g;
            a.querySelector("h2").textContent = `${ordinal(g)} კლასი`;
            a.querySelector(".grade-meta").textContent = `${total} ქვიზი · ${yearList.length} წელი`;
            if (showProgress) {
                const pct = total ? Math.round((done / total) * 100) : 0;
                const prog = document.createElement("span");
                prog.className = "grade-progress";
                prog.innerHTML = `<span class="grade-bar" aria-hidden="true"><span style="width:${pct}%"></span></span><span class="grade-done"></span>`;
                prog.querySelector(".grade-done").textContent =
                    done ? `${done} / ${total} გავლილი${done === total ? " ✓" : ""}` : "ჯერ არ დაგიწყია";
                a.querySelector(".grade-content").appendChild(prog);
            }
            return a;
        }

        // Under the notes: the problem bank and the theory as two cards (math only; theory once at
        // least one page is visible: reviewed, or drafts allowed, same rule as TagUI.theoryDrafts),
        // then a hand-written link to the random quiz.
        function sideCard(href, icon, title, text) {
            const a = document.createElement("a");
            a.href = href;
            a.className = "side-card";
            a.innerHTML = `<span class="side-card-ic" aria-hidden="true"><i class="fas ${icon}"></i></span>
                <span><b></b><small></small></span>`;
            a.querySelector("b").textContent = title;
            a.querySelector("small").textContent = text;
            return a;
        }

        function renderExtras() {
            if (subject.id === "math") {
                const bank = sideCard("problems.html", "fa-magnifying-glass", "ამოცანების ბაზა", "ძიება თემის, კლასისა და სირთულის მიხედვით");
                extras.appendChild(bank);

                let drafts = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
                try { drafts = drafts || localStorage.getItem("theory-drafts") === "1"; } catch (e) {}
                fetch("data/theory.json", { cache: "no-cache" })
                    .then(r => (r.ok ? r.json() : []))
                    .then(rows => {
                        const visible = rows.filter(r => r.reviewed || drafts).length;
                        if (!visible) return;
                        bank.after(sideCard("theory.html", "fa-book-open", "თეორია", `${visible} თემა · განმარტებები და ამოხსნილი მაგალითები`));
                    })
                    .catch(() => {});
            }
            const random = document.createElement("a");
            random.href = pageUrl("random-quiz-generator.html");
            random.className = "hand-note";
            random.textContent = "შემთხვევითი ქვიზის გენერირება";
            extras.appendChild(random);
        }

        function render(index) {
            const grades = Object.keys(index).map(Number).sort((a, b) => a - b);
            const showProgress = grades.some(g => Object.keys(index[g]).some(y => index[g][y].some(q => quizDone(g, y, q))));
            grades.forEach(g => grid.appendChild(gradeNote(g, index[g], showProgress)));
            renderExtras();
        }

        loadQuizIndex()
            .then(render)
            .catch(() => {
                const fallback = subject.id === "physics" ? [8, 9, 10, 11] : [7, 8, 9, 10, 11];
                fallback.forEach(g => {
                    const a = document.createElement("a");
                    a.href = pageUrl("class-quizzes.html", { class: g });
                    a.className = "grade-card";
                    a.innerHTML = `<div class="grade-content"><span class="grade-number">${g}</span><h2>${ordinal(g)} კლასი</h2></div>`;
                    grid.appendChild(a);
                });
                renderExtras();
            });
    })();
    </script>
