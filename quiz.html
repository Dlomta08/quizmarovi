<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes">
  <meta name="description" content="კომაროვის სკოლის მათემატიკისა და ფიზიკის ქვიზი: ამოხსენით ამოცანები, შეამოწმეთ პასუხები, ნახეთ ამოხსნები ან გაიარეთ ტაიმერიანი სიმულაცია.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="კომაროვის ქვიზები">
  <meta property="og:locale" content="ka_GE">
  <meta property="og:title" content="ქვიზი · კომაროვის ქვიზები">
  <meta property="og:description" content="კომაროვის სკოლის მათემატიკისა და ფიზიკის ქვიზი: ამოხსენით ამოცანები, შეამოწმეთ პასუხები, ნახეთ ამოხსნები ან გაიარეთ ტაიმერიანი სიმულაცია.">

  <title>ქვიზი</title>
  <link rel="stylesheet" href="style.css?v=5">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="quiz-style.css?v=5">
  <link rel="stylesheet" href="theme.css?v=5">
  <link rel="icon" type="image/png" href="paper.png">
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js" async></script>
  <script src="darkmode.js?v=5"></script>
  <script src="subjects.js?v=5"></script>
  <script src="tags-ui.js?v=5"></script>
  <script src="progress.js?v=5"></script>
  <script src="feedback.js?v=5" defer></script>
  <script src="notice.js?v=6" defer></script>
</head>
<body>

  <nav class="main-nav">
    <div class="nav-content">
      <a href="#" id="back-link" class="logo">
        <i class="fas fa-arrow-left"></i>
        <span>უკან დაბრუნება</span>
      </a>
      <button id="toggle-dark" aria-label="Toggle dark mode">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </nav>

  <div class="quiz-view-container">
    <div class="quiz-card-main">
      <h1 id="quiz-title" class="text-title"></h1>

      <div id="mode-selection" class="mode-selection-card">
        <p>აირჩიეთ რეჟიმი:</p>
        <div>
          <button class="button" onclick="startQuiz(false)">სტანდარტული</button>
          <button class="button" onclick="startQuiz(true)">სიმულაცია</button>
        </div>
      </div>

      <div id="timer" style="display: none;">დარჩენილი დრო: <span id="time">03:00:00</span></div>

      <form id="quizForm" style="display:none;"></form>
    </div>
  </div>

  <footer class="main-footer">
        <p>&copy; 2026 სსიპ ვლადიმირ კომაროვის თბილისის ფიზიკა-მათემატიკის N199 საჯარო სკოლა. ყველა უფლება დაცულია.</p>
        <p>საკონტაქტო ინფორმაცია:
        <a href="mailto:komaroviqvizebi@gmail.com" class="email-link">komaroviqvizebi@gmail.com</a>
        </p>

        <style>
        .email-link {
            color: var(--primary-color);
            text-decoration: none;
            transition: text-decoration 0.2s ease;
        }

    .email-link:hover {
        text-decoration: underline;
    }
    </style>
    </footer>

  <script>
    (function () {
      const { subject, pageUrl, loadQuizIndex, ordinal } = window.QuizSite;
      const params = new URLSearchParams(window.location.search);
      const classNum = params.get("class");
      const year = params.get("year");
      const number = params.get("number");
      const main = document.querySelector(".quiz-card-main");
      const showMessage = text => { main.innerHTML = `<h1>${text}</h1>`; };

      // Only digits / "2025-26" are accepted, so the URL can never point at another file.
      if (!/^\d{1,2}$/.test(classNum || "") || !/^\d{4}-\d{2}$/.test(year || "") || !/^\d{1,2}$/.test(number || "")) {
        showMessage("არასწორი ბმული.");
        return;
      }

      const numShow = ordinal(number);
      document.title = `${subject.genitive} ${numShow} ქვიზი - ${classNum} კლასი`;
      document.getElementById("quiz-title").textContent =
        `${subject.genitive} ${numShow} ქვიზი — ${classNum} კლასი, ${year.replace("-", "/")} წელი.`;
      document.getElementById("back-link").href = pageUrl("class-quizzes.html", { class: classNum });

      function loadQuizData() {
        const script = document.createElement("script");
        script.src = `${subject.dir}/class-${classNum}/${year}/quiz-${number}.js`;
        script.onload = () => {
          if (typeof quizData === "undefined" || !Array.isArray(quizData) || !quizData.length) {
            showMessage("ქვიზი არ ჩატარებულა.");
            return;
          }
          if (typeof resumeSavedSimulation === "function") resumeSavedSimulation();
        };
        script.onerror = () => showMessage("ქვიზი არ ჩატარებულა.");
        document.head.appendChild(script);
      }

      loadQuizIndex()
        .then(index => {
          const exists = ((index[classNum] || {})[year] || []).includes(Number(number));
          if (exists) loadQuizData();
          else showMessage("ქვიზი არ ჩატარებულა.");
        })
        // If the quiz list itself can't be loaded, still try the file directly.
        .catch(loadQuizData);
    })();
  </script>
  
  <script src="quiz.js?v=5"></script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    
    
</body>
</html>
