    <div class="quiz-container">

        <!-- Years and quiz cards are added from quizzes.json, so only existing quizzes appear. -->

    <footer class="main-footer">

        <p>საკონტაქტო ინფორმაცია:
        <a href="mailto:komaroviqvizebi@gmail.com" class="email-link">komaroviqvizebi@gmail.com</a>
        </p>

        <style>
        .email-link {

    <script>
    (function () {
        const { subject, pageUrl, loadQuizIndex, ordinal } = window.QuizSite;
        const classNum = parseInt(new URLSearchParams(location.search).get("class"), 10);
        // No grade in the link (e.g. old /physics-quizzes links): let the student pick one.
        if (!classNum) {
            location.replace(pageUrl("classes.html"));
            return;
        }

        const heading = `${ordinal(classNum)} კლასის ${subject.genitive} ქვიზები`;
        document.title = heading;
        document.querySelector(".text-title").textContent = heading;
        document.getElementById("back-link").href = pageUrl("classes.html");

        const yearsGrid = document.getElementById("yearsGrid");

        /* ---- progress saved by quiz.js in this browser ----
           Each ticket is in one of three states (theme.css .quiz-card[data-state]):
           done    - finished (best score saved) or marked done: green, a tick, the best score in red pen
           started - some questions answered (math: per-problem results in progress.js; both subjects:
                     an unfinished simulation in this tab): a half-filled dot, "7/25" and a strip along the bottom
           new     - just the name */
        function safeGet(key) {
            try { return localStorage.getItem(key); } catch { return null; }
        }
        function safeJson(key, store) {
            try { return JSON.parse((store || localStorage).getItem(key)) || {}; } catch { return {}; }
        }
        // Best score is saved by quiz.js under the same key with "best-" instead of "done-".
        function getBest(prefix) {
            const b = safeJson(prefix.replace(/^done-/, "best-"));
            return typeof b.score === "number" ? b : null;
        }
        // Answers of a simulation still running in this tab (quiz.js keeps it under "sim-state:<page url>").
        function simAnswers(year, q) {
            let n = 0;
            try {
                Object.keys(sessionStorage).filter(k => k.startsWith("sim-state:")).forEach(k => {
                    const p = new URL(k.slice("sim-state:".length), location.origin).searchParams;
                    if (p.get("class") === String(classNum) && p.get("year") === year && p.get("number") === String(q) &&
                        (p.get("subject") || "math") === subject.id) {
                        n = Math.max(n, Object.keys(safeJson(k, sessionStorage).answers || {}).length);
                    }
                });
            } catch {}
            return n;
        }
        function renderTicket(card, progress, sizes) {
            const { year, q, keyprefix } = card.dataset;
            const best = getBest(keyprefix);
            const done = safeGet(keyprefix) === "true" || !!best;
            let answered = 0;
            if (!done) {
                const pidPrefix = `${classNum}-${year}-${q}-`;   // progress.js ids (math only)
                if (subject.id === "math") answered = Object.keys(progress).filter(k => k.startsWith(pidPrefix)).length;
                answered = Math.max(answered, simAnswers(year, q));
            }
            const size = sizes[keyprefix.replace(/^done-/, "")];
            card.dataset.state = done ? "done" : answered ? "started" : "new";

            const status = card.querySelector(".status-icon");
            status.title = done ? "დასრულებულია" : answered ? "დაწყებულია" : "";
            if (status.title) status.setAttribute("aria-label", status.title); else status.removeAttribute("aria-label");

            const bestEl = card.querySelector(".best-score");
            bestEl.textContent = best ? `${best.score}/${best.total}` : "";
            bestEl.title = best ? "საუკეთესო შედეგი" : "";
            bestEl.hidden = !best;

            const prog = card.querySelector(".quiz-progress");
            prog.textContent = !done && answered ? (size ? `${Math.min(answered, size)}/${size}` : String(answered)) : "";
            prog.title = prog.textContent ? "ნაპასუხები ამოცანები" : "";
            prog.hidden = !prog.textContent;
            card.style.setProperty("--p", !done && answered && size ? Math.min(1, answered / size) : 0);
        }
        function refreshAll() {
            const progress = subject.id === "math" ? safeJson("problem-progress") : {};
            const sizes = safeJson("quiz-sizes");
            document.querySelectorAll(".quiz-card[data-keyprefix]").forEach(c => renderTicket(c, progress, sizes));
            // year heading: "5 ქვიზი · 1 გავლილი"
            document.querySelectorAll(".year-section").forEach(sec => {
                const small = sec.querySelector(".year-header small");
                const total = sec.querySelectorAll(".quiz-card").length;
                const done = sec.querySelectorAll('.quiz-card[data-state="done"]').length;
                small.textContent = `${total} ქვიზი` + (done ? ` · ${done} გავლილი` : "");
            });
        }

        function quizCard(year, q) {
            // A real link, so it works with Tab/Enter and "open in new tab".
            const card = document.createElement("a");
            card.className = "quiz-card";
            card.href = pageUrl("quiz.html", { class: classNum, year, number: q });
            card.dataset.year = year;
            card.dataset.q = q;
            card.dataset.keyprefix = `done-${subject.keyPrefix}${classNum}-${year}-${q}`;

            const status = document.createElement("span");
            status.className = "status-icon";

            const title = document.createElement("h3");
            title.className = "quiz-title";
            title.textContent = `${ordinal(q)} ქვიზი`;

            const prog = document.createElement("span");
            prog.className = "quiz-progress";

            const best = document.createElement("span");
            best.className = "best-score";

            card.append(status, title, prog, best);
            return card;
        }

        function render(years) {
            const entries = Object.entries(years);
            if (!entries.length) {
                yearsGrid.innerHTML = "<p>ამ კლასისთვის ქვიზები ჯერ არ არის დამატებული.</p>";
                return;
            }
            entries.forEach(([year, numbers]) => {
                const section = document.createElement("div");
                section.className = "year-section";

                const header = document.createElement("div");
                header.className = "year-header";
                const icon = document.createElement("i");
                icon.className = "fas fa-calendar-alt";
                const h2 = document.createElement("h2");
                h2.textContent = `${year.replace("-", "/")} სასწავლო წელი`;
                const count = document.createElement("small");
                count.textContent = `${numbers.length} ქვიზი`;
                header.append(icon, h2, count);

                const grid = document.createElement("div");
                grid.className = "quizzes-grid";
                numbers.forEach(q => grid.appendChild(quizCard(year, q)));

                section.append(header, grid);
                yearsGrid.appendChild(section);
            });
            refreshAll();
        }

        // Grade tabs above the list (sticky notes) and a hand-written link to the random quiz under it.
        function renderTabs(index) {
            const bar = document.createElement("nav");
            bar.className = "stick";
            bar.setAttribute("aria-label", "კლასები");
            Object.keys(index).map(Number).sort((a, b) => a - b).forEach(g => {
                const a = document.createElement("a");
                a.href = pageUrl("class-quizzes.html", { class: g });
                a.textContent = g;
                a.title = `${ordinal(g)} კლასი`;
                if (g === classNum) a.setAttribute("aria-current", "page");
                bar.appendChild(a);
            });
            document.querySelector(".page-header").after(bar);
            const hand = document.createElement("a");
            hand.className = "hand-note";
            hand.href = pageUrl("random-quiz-generator.html");
            hand.textContent = "გინდა სხვადასხვა წლის ამოცანები ერთად? ცადე „შემთხვევითი ქვიზი“";
            yearsGrid.after(hand);
        }

        loadQuizIndex()
            .then(index => { renderTabs(index); render(index[classNum] || {}); })
            .catch(() => {
                yearsGrid.innerHTML = "<p>ქვიზების სია ვერ ჩაიტვირთა. სცადეთ გვერდის განახლება.</p>";
            });

        window.addEventListener("pageshow", e => { if (e.persisted) refreshAll(); });
        window.addEventListener("storage", e => {
            if (e.key && (/^(done|best)-/.test(e.key) || e.key === "problem-progress" || e.key === "quiz-sizes")) refreshAll();
        });
    })();
    </script>
