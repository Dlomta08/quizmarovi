    <script src="supabase-config.js?v=6" defer></script>

<body>
    <nav class="main-nav">
        <div class="nav-content">
            <a href="classes.html" class="logo" id="back-link">
                <i class="fas fa-arrow-left"></i>
                <span>უკან დაბრუნება</span>
            </a>
            <button id="toggle-dark" aria-label="Toggle dark mode">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </nav>

    <div class="quiz-container">
        <div class="page-header">
            <h1 class="text-title"></h1>
        </div>

        <!-- Years and quiz cards are added from quizzes.json, so only existing quizzes appear. -->
        <div class="years-grid" id="yearsGrid"></div>
    </div>

    <footer class="main-footer">
        <p>&copy; 2026 სსიპ ვლადიმირ კომაროვის თბილისის ფიზიკა-მათემატიკის N199 საჯარო სკოლა. ყველა უფლება დაცულია.</p>
        <p>საკონტაქტო ინფორმაცია:
        <a href="mailto:komaroviqvizebi@gmail.com" class="email-link">komaroviqvizebi@gmail.com</a>
        </p>

        <style>
        .email-link {
            color: var(--primary-color);
            text-decoration: none;
            transition: text-decoration 0.2s ease;
        }

    .email-link:hover {
        text-decoration: underline;
    }
    </style>
    </footer>

    <script>
    (function () {
        const { subject, pageUrl, loadQuizIndex, ordinal } = window.QuizSite;
        const classNum = parseInt(new URLSearchParams(location.search).get("class"), 10);
        // No grade in the link (e.g. old /physics-quizzes links): let the student pick one.
        if (!classNum) {
            location.replace(pageUrl("classes.html"));
            return;
        }

        const heading = `${ordinal(classNum)} კლასის ${subject.genitive} ქვიზები`;
        document.title = heading;
        document.querySelector(".text-title").textContent = heading;
        document.getElementById("back-link").href = pageUrl("classes.html");

        const yearsGrid = document.getElementById("yearsGrid");

        /* ---- progress saved by quiz.js in localStorage ---- */
        function safeGet(key) {
            try { return localStorage.getItem(key); } catch { return null; }
        }
        function isDone(prefix) {
            return safeGet(prefix) === "true";
        }
        // Best score is saved by quiz.js under the same key with "best-" instead of "done-".
        function getBest(prefix) {
            try {
                const b = JSON.parse(safeGet(prefix.replace(/^done-/, "best-")));
                return b && typeof b.score === "number" ? b : null;
            } catch { return null; }
        }
        function renderStatus(icon, prefix) {
            const done = isDone(prefix);
            icon.classList.toggle("done", done);
            icon.title = done ? "დასრულებულია" : "არ არის დასრულებული";
            icon.setAttribute("aria-label", icon.title);
        }
        function renderBest(el, prefix) {
            const b = getBest(prefix);
            el.textContent = b ? `${b.score}/${b.total}` : "";
            el.title = b ? "საუკეთესო შედეგი" : "";
            el.hidden = !b;
        }
        function refreshAll() {
            document.querySelectorAll(".status-icon[data-keyprefix]").forEach(el => renderStatus(el, el.dataset.keyprefix));
            document.querySelectorAll(".best-score[data-keyprefix]").forEach(el => renderBest(el, el.dataset.keyprefix));
        }

        function quizCard(year, q) {
            // A real link, so it works with Tab/Enter and "open in new tab".
            const card = document.createElement("a");
            card.className = "quiz-card";
            card.href = pageUrl("quiz.html", { class: classNum, year, number: q });

            const icon = document.createElement("i");
            icon.className = "fas fa-file-alt quiz-icon";

            const num = document.createElement("span");
            num.className = "quiz-number";
            num.textContent = q;

            const title = document.createElement("h3");
            title.className = "quiz-title";
            title.textContent = `${ordinal(q)} ქვიზი`;

            const keyPrefix = `done-${subject.keyPrefix}${classNum}-${year}-${q}`;
            const status = document.createElement("i");
            status.className = "fas fa-circle status-icon";
            status.dataset.keyprefix = keyPrefix;
            renderStatus(status, keyPrefix);

            const best = document.createElement("span");
            best.className = "best-score";
            best.dataset.keyprefix = keyPrefix;
            renderBest(best, keyPrefix);

            card.append(icon, num, title, status, best);
            return card;
        }

        function render(years) {
            const entries = Object.entries(years);
            if (!entries.length) {
                yearsGrid.innerHTML = "<p>ამ კლასისთვის ქვიზები ჯერ არ არის დამატებული.</p>";
                return;
            }
            entries.forEach(([year, numbers]) => {
                const section = document.createElement("div");
                section.className = "year-section";

                const header = document.createElement("div");
                header.className = "year-header";
                const icon = document.createElement("i");
                icon.className = "fas fa-calendar-alt";
                const h2 = document.createElement("h2");
                h2.textContent = `${year.replace("-", "/")} სასწავლო წელი`;
                const count = document.createElement("small");
                count.textContent = `${numbers.length} ქვიზი`;
                header.append(icon, h2, count);

                const grid = document.createElement("div");
                grid.className = "quizzes-grid";
                numbers.forEach(q => grid.appendChild(quizCard(year, q)));

                section.append(header, grid);
                yearsGrid.appendChild(section);
            });
        }

        // Grade tabs above the list (sticky notes) and a hand-written link to the random quiz under it.
        function renderTabs(index) {
            const bar = document.createElement("nav");
            bar.className = "stick";
            bar.setAttribute("aria-label", "კლასები");
            Object.keys(index).map(Number).sort((a, b) => a - b).forEach(g => {
                const a = document.createElement("a");
                a.href = pageUrl("class-quizzes.html", { class: g });
                a.textContent = g;
                a.title = `${ordinal(g)} კლასი`;
                if (g === classNum) a.setAttribute("aria-current", "page");
                bar.appendChild(a);
            });
            document.querySelector(".page-header").after(bar);
            const hand = document.createElement("a");
            hand.className = "hand-note";
            hand.href = pageUrl("random-quiz-generator.html");
            hand.textContent = "გინდა სხვადასხვა წლის ამოცანები ერთად? ცადე „შემთხვევითი ქვიზი“";
            yearsGrid.after(hand);
        }

        loadQuizIndex()
            .then(index => { renderTabs(index); render(index[classNum] || {}); })
            .catch(() => {
                yearsGrid.innerHTML = "<p>ქვიზების სია ვერ ჩაიტვირთა. სცადეთ გვერდის განახლება.</p>";
            });

        window.addEventListener("pageshow", e => { if (e.persisted) refreshAll(); });
        window.addEventListener("storage", e => {
            if (e.key && (e.key.startsWith("done-") || e.key.startsWith("best-"))) refreshAll();
        });
    })();
    </script>

    <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
