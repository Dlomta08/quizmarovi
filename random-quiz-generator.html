<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="შექმენით შემთხვევითი ქვიზი კომაროვის სკოლის წინა წლების ამოცანებიდან: აირჩიეთ კლასები, ქვიზები და ამოცანების რაოდენობა.">
    <title>შემთხვევითი ქვიზის გენერატორი</title>
    <link rel="stylesheet" href="style.css?v=3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="random-quiz-generator.css">
    <link rel="icon" type="image/png" href="paper.png">
    <script src="darkmode.js"></script>
    <script src="subjects.js"></script>
    <script src="feedback.js" defer></script>
</head>
<body>

    <nav class="main-nav">
        <div class="nav-content">
            <a href="classes.html" class="logo">
                <i class="fas fa-arrow-left"></i>
                <span>უკან დაბრუნება</span>
            </a>
            <button id="toggle-dark" aria-label="Toggle dark mode">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </nav>

    <div class="generator-container">
        <div class="generator-card">
            <h1 class="generator-title">შემთხვევითი ქვიზის გენერატორი</h1>

            <div class="option-group">
                <h3>აირჩიეთ კლასები:</h3>
                <button class="select-all-btn" onclick="toggleAllClasses()">ყველას მონიშვნა/მოხსნა</button>
                <div class="checkbox-grid" id="classCheckboxes"></div>
            </div>

            <div class="option-group">
                <h3>აირჩიეთ ქვიზები:</h3>
                <button class="select-all-btn" onclick="toggleAllQuizzes()">ყველას მონიშვნა/მოხსნა</button>
                <div class="checkbox-grid" id="quizCheckboxes"></div>
            </div>

            <div class="option-group">
                <div class="number-input-group">
                    <label for="problemCount">ამოცანების რაოდენობა:</label>
                    <input type="number" id="problemCount" min="1" max="100" value="25">
                </div>
            </div>

            <div id="errorMessage" class="error-message" style="display: none;"></div>
            <div id="loadingSpinner" class="loading-spinner">იტვირთება... გთხოვთ დაელოდოთ</div>

            <div class="generate-btn-container">
                <button class="generate-btn button" onclick="generateQuiz()">
                    <i class="fas fa-dice"></i> ქვიზის გენერირება
                </button>
            </div>
        </div>
    </div>

    <footer class="main-footer">
        <p>&copy; 2026 სსიპ ვლადიმირ კომაროვის თბილისის ფიზიკა-მათემატიკის N199 საჯარო სკოლა. ყველა უფლება დაცულია.</p>
        <p>საკონტაქტო ინფორმაცია:
        <a href="mailto:komaroviqvizebi@gmail.com" class="email-link">komaroviqvizebi@gmail.com</a>
        </p>

        <style>
        .email-link {
            color: var(--primary-color);
            text-decoration: none;
            transition: text-decoration 0.2s ease;
        }

    .email-link:hover {
        text-decoration: underline;
    }
    </style>
    </footer>
    <script>
        // The subject (?subject=physics) and the available classes come from subjects.js / quizzes.json.
        (function () {
            const { subject, pageUrl, loadQuizIndex, ordinal } = window.QuizSite;
            const title = `${subject.genitive} შემთხვევითი ქვიზის გენერატორი`;
            document.title = title;
            document.querySelector('.generator-title').textContent = title;
            document.querySelector('.main-nav .logo').href = pageUrl('classes.html');

            function addCheckbox(container, name, value, text, checked) {
                const label = document.createElement('label');
                label.className = 'checkbox-label' + (checked ? ' checked' : '');
                label.innerHTML = `<input type="checkbox" name="${name}" value="${value}" ${checked ? 'checked' : ''}><span>${text}</span>`;
                label.querySelector('input').addEventListener('change', function () {
                    label.classList.toggle('checked', this.checked);
                });
                container.appendChild(label);
            }

            function render(classes) {
                const classContainer = document.getElementById('classCheckboxes');
                classes.forEach((c, i) => addCheckbox(classContainer, 'class', c, `${c} კლასი`, i === 0));
                const quizContainer = document.getElementById('quizCheckboxes');
                for (let i = 1; i <= 5; i++) addCheckbox(quizContainer, 'quiz', i, `${ordinal(i)} ქვიზი`, true);
            }

            loadQuizIndex()
                .then(index => render(Object.keys(index).map(Number).sort((a, b) => a - b)))
                .catch(() => render(subject.id === 'physics' ? [8, 9, 10, 11] : [7, 8, 9, 10, 11]));
        })();
    </script>
    <script src="rand.js"></script>
    <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
